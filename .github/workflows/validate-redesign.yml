name: Validate Jekyll redesign
on:
  push:
    branches: [redesign-v2]
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler: '2.5.22'
          bundler-cache: true
      - name: Build
        run: bundle exec jekyll build
      - name: Preserve resolved dependencies for review
        uses: actions/upload-artifact@v4
        with:
          name: resolved-gemfile-lock
          path: Gemfile.lock
      - name: Reject developer documentation in generated site
        shell: bash
        run: |
          set -eu
          test -d _site
          leaked="$(find _site -iname 'AGENTS.md' -o -name '_docs' -o -iname 'ARCHITECTURE.md' -o -iname 'DESIGN-SYSTEM.md' -o -iname 'INTERNATIONALIZATION.md' -o -iname 'SEO-GUIDELINES.md' -o -iname 'CONTENT-GUIDELINES.md' -o -iname 'SERVICES-SCHEMA.md' -o -iname 'PARTNERS.md' -o -iname 'CONTRIBUTING.md')"
          if [ -n "$leaked" ]; then
            printf '%s\n' "$leaked"
            exit 1
          fi
      - name: Build historical reference for route comparison
        shell: bash
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/rmb-baseline"
          git archive 4dd96bdf4d448c7a1c904f1e43514d57334817e4 | tar -x -C "$RUNNER_TEMP/rmb-baseline"
          bundle exec jekyll build --source "$RUNNER_TEMP/rmb-baseline" --destination "$RUNNER_TEMP/rmb-baseline-site"
      - name: Validate production SEO artifacts
        run: python3 scripts/validate_seo.py _site --baseline "$RUNNER_TEMP/rmb-baseline-site"
      - name: Test redirect manifest validation
        run: python3 -m unittest discover -s scripts -p 'test_redirects.py'
      - name: Export Cloudflare Bulk Redirects
        run: python3 scripts/generate_redirects.py --output "$RUNNER_TEMP/redirects.csv"
      - name: Upload redirect CSV
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-bulk-redirects
          path: ${{ runner.temp }}/redirects.csv
      - name: Validate multilingual preview
        run: python3 scripts/validate_preview.py _site
      - name: Upload compiled site for local review
        uses: actions/upload-artifact@v4
        with:
          name: rmb-v2-preview
          path: _site/
          if-no-files-found: error
          retention-days: 14
