name: Validate Jekyll redesign
on:
  push:
    branches: [redesign-v2]
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler: '2.5.22'
          bundler-cache: true
      - name: Build
        run: bundle exec jekyll build
      - name: Preserve resolved dependencies for review
        uses: actions/upload-artifact@v4
        with:
          name: resolved-gemfile-lock
          path: Gemfile.lock
      - name: Reject developer documentation in generated site
        shell: bash
        run: |
          set -eu
          test -d _site
          leaked="$(find _site -iname 'AGENTS.md' -o -name '_docs' -o -iname 'ARCHITECTURE.md' -o -iname 'DESIGN-SYSTEM.md' -o -iname 'INTERNATIONALIZATION.md' -o -iname 'SEO-GUIDELINES.md' -o -iname 'CONTENT-GUIDELINES.md' -o -iname 'SERVICES-SCHEMA.md' -o -iname 'PARTNERS.md' -o -iname 'CONTRIBUTING.md')"
          if [ -n "$leaked" ]; then
            printf '%s\n' "$leaked"
            exit 1
          fi
