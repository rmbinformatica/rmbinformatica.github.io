<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'pt-BR' | escape }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title | escape }}{% if page.title and page.title != site.title %} | {{ site.title | escape }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url | escape }}">
  {% if page.noindex %}<meta name="robots" content="noindex, nofollow">{% endif %}
  <meta name="verification" content="14ac57deb189f910924274fb9ee7fb2a">
  <meta name="lomadee-verification" content="23082398">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title | escape }}" href="{{ '/feed.xml' | relative_url }}">
  <link rel="icon" href="{{ '/images/logo_rmb_globo_binario.png' | relative_url }}" type="image/png">
  <script src="{{ '/assets/js/theme.js' | relative_url }}"></script>
  <link rel="stylesheet" href="{{ '/assets/css/rmb.css' | relative_url }}">
  {% unless page.noindex %}{% include google-analytics.html %}{% endunless %}
</head>
<body>
  <a class="rmb-skip" href="#conteudo">Ir para o conteúdo</a>
  <header class="rmb-header">
    <div class="rmb-container rmb-header-inner">
      <a class="rmb-logo" href="{{ '/' | relative_url }}"><img src="{{ '/images/logo_rmb_globo_binario.png' | relative_url }}" alt="" width="48" height="48"><span>RMB Informática</span></a>
      <nav class="rmb-nav" aria-label="Navegação principal">
        <a href="{{ '/#services' | relative_url }}">Serviços</a>
        <a href="{{ '/blog/' | relative_url }}">Blog</a>
        <a href="https://ajuda.rmbinformatica.com.br/">Ajuda</a>
        <a href="{{ '/contato.html' | relative_url }}">Contato</a>
      </nav>
      <label class="rmb-theme" for="rmb-theme">Tema
        <select id="rmb-theme">
          <option value="system">Sistema</option><option value="light">Claro</option><option value="dark">Escuro</option>
        </select>
      </label>
    </div>
  </header>
  <main id="conteudo">{{ content }}</main>
  <footer class="rmb-footer">
    <div class="rmb-container">
      <p><strong>RMB Informática</strong> · Natal/RN, Brasil</p>
      <nav class="rmb-footer-links" aria-label="Links do rodapé">
        <a href="{{ '/contato.html' | relative_url }}">Contato</a>
        <a href="{{ '/blog/' | relative_url }}">Blog</a>
        <a href="https://ajuda.rmbinformatica.com.br/">Portal de ajuda</a>
        <a href="https://rmbinformatica.com.br/">Ferramentas online</a>
        <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      </nav>
    </div>
  </footer>
</body>
</html>
